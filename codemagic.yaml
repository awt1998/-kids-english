# Cloud builds for the stores (https://codemagic.io), so no Mac is needed.
# Setup once in the Codemagic web app (see docs/PUBLISHING_GUIDE.md):
#  - Android: upload the upload keystore under Team settings → Code signing
#    identities → Android keystores, with the reference name "labeeb_upload".
#  - iOS: add an App Store Connect API key integration named "Labeeb ASC".
#  The AdMob ids below are public (they ship inside the app). Only release
#  builds here use them; local/debug builds keep Google's test ids.
workflows:
  android-release:
    name: Android release (AAB for Google Play)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 21
      android_signing:
        - labeeb_upload
      vars:
        ADMOB_APP_ID: ca-app-pub-8355791720063217~6828215843
        ADMOB_INTERSTITIAL: ca-app-pub-8355791720063217/7510742123
    scripts:
      - name: Tests
        script: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build the app bundle
        script: |
          flutter build appbundle --release \
            --build-number=$((BUILD_NUMBER + 100)) \
            --dart-define=ADMOB_INTERSTITIAL=$ADMOB_INTERSTITIAL
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Labeeb ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.labeeb.english
    scripts:
      - name: Tests
        script: |
          flutter pub get
          flutter test
      - name: Signing
        script: xcode-project use-profiles
      - name: Build the IPA (no ads SDK on iOS)
        script: |
          flutter build ipa --release \
            --build-number=$((BUILD_NUMBER + 100)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
