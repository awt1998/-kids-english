name: labeeb_ads
description: "Android-only AdMob interstitials for Labeeb, configured for a children's app."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.labeeb.labeeb_ads
        pluginClass: LabeebAdsPlugin
