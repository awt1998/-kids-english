name: kids_english
description: "English for Arab kids: picture + sound learning games."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/content/units/
    - assets/images/mascot/
    - assets/images/words/
    - assets/images/avatars/
    - assets/images/ui/
    - assets/audio/en/words/
    - assets/audio/sfx/

  # Both fonts are variable-weight TTFs under the SIL Open Font License
  # (see assets/fonts/OFL-*.txt).
  fonts:
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/BalooBhaijaan2.ttf
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
